  </g>
  <g filter="url(#softShadow)" transform="translate(316, 214)">
    <rect width="116" height="38" rx="19" fill="#FFFFFF" stroke="#D8C2CD" stroke-width="1.5" />
    <text x="58" y="24" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#2D1826">Citation</text>
