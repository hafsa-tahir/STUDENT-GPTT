<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8E7E7" />
    </radialGradient>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5378" />
      <stop offset="50%" stop-color="#724060" />
      <stop offset="100%" stop-color="#4A253D" />
    </linearGradient>
    <linearGradient id="darkPlumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A253D" />
      <stop offset="100%" stop-color="#2D1826" />
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C69EC7" />
      <stop offset="100%" stop-color="#966397" />
    </linearGradient>
    <linearGradient id="blushCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF3F3" />
    </linearGradient>
    <filter id="shadow3d" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#522943" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2D1826" flood-opacity="0.08" />
    </filter>
    <filter id="softShadow" x="-12%" y="-12%" width="128%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#522943" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="480" height="280" fill="url(#bgGlow)" />
  <g filter="url(#softShadow)" transform="translate(192, 18)">
    <rect width="96" height="36" rx="18" fill="url(#darkPlumGrad)" stroke="#8C5378" stroke-width="1.5" />
    <circle cx="26" cy="18" r="7" fill="#FDE68A" />
    <text x="58" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Quiz</text>
  </g>

  <g filter="url(#shadow3d)">
    <rect x="88" y="96" width="170" height="124" rx="20" transform="rotate(-18 173 158)" fill="url(#berryGrad)" stroke="#FFFFFF" stroke-opacity="0.3" />
    <rect x="126" y="92" width="174" height="126" rx="20" transform="rotate(-12 213 155)" fill="url(#plumGrad)" stroke="#FFFFFF" stroke-opacity="0.25" />
    <rect x="164" y="88" width="178" height="128" rx="20" transform="rotate(-6 253 152)" fill="url(#darkPlumGrad)" />

    <g transform="translate(196, 74) rotate(-2)">
      <rect width="224" height="156" rx="20" fill="#FFFFFF" stroke="#EAD2D9" stroke-width="2" />
      <text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#2D1826">Question 1</text>
      <text x="20" y="47" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#724060">Which law governs electric flux?</text>

      <rect x="20" y="58" width="184" height="26" rx="9" fill="#FDF3F3" stroke="#EAD2D9" />
      <text x="32" y="75" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#724060">A   Faraday Induction Law</text>

      <rect x="20" y="90" width="184" height="26" rx="9" fill="url(#plumGrad)" />
      <text x="32" y="107" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">B   Gauss Flux Theorem</text>
      <text x="186" y="107" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">✓</text>

      <rect x="20" y="122" width="184" height="26" rx="9" fill="#FDF3F3" stroke="#EAD2D9" />
      <text x="32" y="139" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#724060">C   Ampere Circuital Law</text>
    </g>
  </g>
</svg>