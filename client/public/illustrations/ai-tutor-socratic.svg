<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8E7E7" />
    </radialGradient>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5378" />
      <stop offset="50%" stop-color="#724060" />
      <stop offset="100%" stop-color="#4A253D" />
    </linearGradient>
    <linearGradient id="darkPlumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A253D" />
      <stop offset="100%" stop-color="#2D1826" />
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C69EC7" />
      <stop offset="100%" stop-color="#966397" />
    </linearGradient>
    <linearGradient id="blushCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF3F3" />
    </linearGradient>
    <filter id="shadow3d" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#522943" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#2D1826" flood-opacity="0.08" />
    </filter>
    <filter id="softShadow" x="-12%" y="-12%" width="128%" height="132%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#522943" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="480" height="280" fill="url(#bgGlow)" />
  <g filter="url(#shadow3d)" transform="translate(56, 36) rotate(-3)">
    <rect width="220" height="68" rx="20" fill="url(#plumGrad)" />
    <text x="24" y="41" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Solve step-by-step</text>
  </g>

  <g filter="url(#shadow3d)" transform="translate(154, 78) rotate(-2)">
    <rect width="270" height="166" rx="22" fill="#FFFFFF" stroke="#E5C5D0" stroke-width="2" />

    <g filter="url(#softShadow)" transform="translate(18, 16)">
      <rect width="40" height="40" rx="12" fill="url(#berryGrad)" />
      <circle cx="20" cy="17" r="8" fill="#FEF08A" />
      <rect x="16" y="25" width="8" height="5" rx="2" fill="#FFFFFF" />
    </g>

    <text x="70" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#A070A1" letter-spacing="0.08em">SOCRATIC AI TUTOR</text>
    <text x="70" y="50" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#724060">Guided Algebraic Derivation</text>

    <text x="26" y="84" font-family="Inter, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#2D1826">Step 1:  2x + 4 = 10</text>
    <line x1="26" y1="95" x2="240" y2="95" stroke="#F1DCE2" stroke-width="1.5" />

    <text x="26" y="119" font-family="Inter, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#2D1826">Step 2:  2x = 6</text>
    <line x1="26" y1="130" x2="240" y2="130" stroke="#F1DCE2" stroke-width="1.5" />

    <text x="26" y="152" font-family="Inter, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#724060">Step 3:  x = 3   ✓</text>
  </g>
</svg>