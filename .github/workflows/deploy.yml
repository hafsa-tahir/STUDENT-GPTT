name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          SUPABASE_URL: https://cfboullooogzodvrqevy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist/public --functions=netlify/functions --no-build --auth=${{ secrets.NETLIFY_AUTH_TOKEN }} --site=fc1e04ee-c498-43ea-b872-9c823c10fc26
