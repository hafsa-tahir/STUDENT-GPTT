[build]
  command = "pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SUPABASE_URL = "REDACTED"
  SUPABASE_ANON_KEY = "REDACTED"

[[redirects]]
  from = "/api/*"
  to = "/api/index.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
